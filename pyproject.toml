[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "intellidoc"
version = "0.1.0"
description = "Agentic Document Intelligence Pipeline using FastAPI, LangGraph, and RAG"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",

    # Task Queue
    "celery>=5.4.0",
    "redis>=5.0.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-cohere>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",           # async postgres driver
    "psycopg2-binary>=2.9.9",    # sync driver (for Celery workers)
    "psycopg>=3.1.0",
    "pgvector>=0.3.0",

    # Document Parsing
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "spacy>=3.7.0",

    # Storage
    "boto3>=1.35.0",             # S3 / MinIO client

    # Search
    "rank-bm25>=0.2.2",          # sparse BM25 search
    "cohere>=5.9.0",             # reranker

    # Validation & Config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Hot reload for Celery worker in Docker
    "watchdog>=4.0.0",

    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # async test client for FastAPI

    # Linting & Formatting
    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # Type stubs
    "types-redis>=4.6.0",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cov_fail_under = 70

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]