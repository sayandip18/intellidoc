services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellidoc
      POSTGRES_PASSWORD: intellidoc
      POSTGRES_DB: intellidoc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellidoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://intellidoc:intellidoc@postgres:5432/intellidoc
      SYNC_DATABASE_URL: postgresql+psycopg2://intellidoc:intellidoc@postgres:5432/intellidoc
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info -Q ingest,default
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://intellidoc:intellidoc@postgres:5432/intellidoc
      SYNC_DATABASE_URL: postgresql+psycopg2://intellidoc:intellidoc@postgres:5432/intellidoc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
